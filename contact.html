<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — TravelMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-page">
  <nav class="nav">
    <a class="brand" href="index.html"><span>t</span> TravelMate</a>
    <button class="menu-toggle" aria-label="Open menu">☰</button>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a class="active" href="contact.html">Contact</a>
    </div>
  </nav>

  <main class="page-main">
    <section class="contact-layout section">
      <div class="contact-copy">
        <p class="eyebrow">LET'S TALK</p>
        <h1>Got a place<br><em>in mind?</em></h1>
        <p>Tell us what kind of trip you're dreaming about. Beach, mountains, temples, food, cities — anything goes.</p>
        <div class="contact-detail">
          <span>EMAIL</span>
          <a href="mailto:hello@travelmate.example">hello@travelmate.example</a>
        </div>
      </div>

      <form id="contact-form" class="contact-form">
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="e.g. Amrita" required>

        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required>

        <label for="message">What are you looking for?</label>
        <textarea id="message" rows="6" placeholder="A quiet beach, a weekend in Japan..." required></textarea>

        <button class="primary-btn" type="submit">Send message <span>→</span></button>
        <p id="form-message" class="form-message"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div><a class="brand" href="index.html"><span>t</span> TravelMate</a></div>
    <p>Made for people who'd rather collect places than things.</p>
    <div class="footer-links"><a href="index.html">Home</a><a href="about.html">About</a></div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
